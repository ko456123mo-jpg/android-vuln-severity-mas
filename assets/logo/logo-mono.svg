<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Android Vulnerability Severity MAS">
  <title>Android Vulnerability Severity MAS</title>
  <defs>
    <!-- تدرّج سطح الدرع: أزرق داكن سيبراني -->
    <linearGradient id="lg-shield-fill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#132C42"/>
      <stop offset="55%" stop-color="#0E2233"/>
      <stop offset="100%" stop-color="#0A1929"/>
    </linearGradient>
    <!-- تدرّج حدّ الدرع: سماوي كهربائي -->
    <linearGradient id="lg-shield-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="55%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <!-- تدرّج الأعمدة: سماوي → برتقالي → أحمر (شدة الخطورة) -->
    <linearGradient id="lg-sev-high" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
    <linearGradient id="lg-bar-cool" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#48CAE4"/>
    </linearGradient>
    <!-- توهّج مركزي ناعم حول رأس الأندرويد (بلا مرشّحات — توافق أوسع) -->
    <radialGradient id="lg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#00B4D8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- الدرع: الأمن والحماية — العنصر الحاوي للهوية -->
  <g id="lg-shield">
    <path d="M 138.0 70.0 H 374.0 Q 408.0 70.0 408.0 104.0 V 260.0 C 408.0 356.0 342.0 422.0 256.0 468.0 C 170.0 422.0 104.0 356.0 104.0 260.0 V 104.0 Q 104.0 70.0 138.0 70.0 Z" fill="none" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 164.0 96.0 H 348.0 Q 382.0 96.0 382.0 130.0 V 286.0 C 382.0 382.0 342.0 390.0 256.0 436.0 C 170.0 390.0 130.0 382.0 130.0 286.0 V 130.0 Q 130.0 96.0 164.0 96.0 Z" fill="none" stroke="#111111" stroke-width="2.4" stroke-opacity="0.28"/>
  </g>
  <!-- الحلقة المدارية: تعاون الوكلاء الخمسة + اتجاه الدورة -->
  <g id="lg-orbit">
    <path d="M 321.96 203.697 A 66.0 66.0 0 1 1 301.847 158.524" fill="none" stroke="#111111" stroke-width="4.2" stroke-linecap="round" stroke-opacity="0.55"/>
    <!-- الوكيل 1 / node 1 -->
    <circle cx="195.706" cy="179.155" r="10.70" fill="#111111" opacity="0.16"/><circle cx="195.706" cy="179.155" r="6.2" fill="#111111"/>
    <!-- الوكيل 2 / node 2 -->
    <circle cx="262.899" cy="140.362" r="10.70" fill="#111111" opacity="0.16"/><circle cx="262.899" cy="140.362" r="6.2" fill="#111111"/>
    <!-- الوكيل 3 / node 3 -->
    <circle cx="320.558" cy="219.722" r="12.25" fill="#111111" opacity="0.16"/><circle cx="320.558" cy="219.722" r="7.75" fill="#111111"/>
    <!-- الوكيل 4 / node 4 -->
    <circle cx="258.303" cy="271.96" r="10.70" fill="#111111" opacity="0.16"/><circle cx="258.303" cy="271.96" r="6.2" fill="#111111"/>
    <!-- الوكيل 5 / node 5 -->
    <circle cx="191.96" cy="221.967" r="10.70" fill="#111111" opacity="0.16"/><circle cx="191.96" cy="221.967" r="6.2" fill="#111111"/>
    <path d="M 301.847 158.524 L 286.197 155.197 L 297.976 142.999 Z" fill="#111111" fill-opacity="0.9"/>
  </g>
  <!-- رأس أندرويد مجرّد: التطبيق المستهدف للتحليل -->
  <g id="lg-android">
    <circle cx="256.0" cy="197.4" r="83.6" fill="none"/>
    <path d="M 212.0 204.0 A 44.0 44.0 0 0 1 300.0 204.0 Z" fill="none" stroke="#111111" stroke-width="2.42" stroke-linejoin="round"/>
    <g stroke="#111111" stroke-width="4.4" stroke-linecap="round" fill="none">
      <path d="M 230.137 168.403 L 216.374 153.425"/>
      <path d="M 281.863 168.403 L 295.626 153.425"/>
    </g>
    <circle cx="216.374" cy="153.425" r="3.74" fill="#111111"/>
    <circle cx="295.626" cy="153.425" r="3.74" fill="#111111"/>
    <!-- العينان: عينان تحليل تفحصان الكود -->
    <circle cx="237.52" cy="192.56" r="5.0600000000000005" fill="#111111"/>
    <circle cx="274.48" cy="192.56" r="5.0600000000000005" fill="#111111"/>
  </g>
  <!-- أعمدة الخطورة: Low → Medium → High → Critical -->
  <g id="lg-bars">
    <!-- العمود 1: Low -->
    <rect x="172.00" y="346.00" width="30.00" height="46.00" rx="15.00" fill="#111111" fill-opacity="0.40"/>
    <!-- العمود 2: Medium -->
    <rect x="218.00" y="318.00" width="30.00" height="74.00" rx="15.00" fill="#111111" fill-opacity="0.55"/>
    <!-- العمود 3: High -->
    <rect x="264.00" y="286.00" width="30.00" height="106.00" rx="15.00" fill="#111111" fill-opacity="0.70"/>
    <!-- العمود 4: Critical -->
    <rect x="310.00" y="246.00" width="30.00" height="146.00" rx="15.00" fill="#111111" fill-opacity="1"/>
    <path d="M 158.00 406.00 H 354.00" stroke="#111111" stroke-opacity="0.55" stroke-width="2.40" stroke-linecap="round"/>
  </g>
</svg>