# =====================================================================
# قائمة تطبيقات التجربة / Experiment app list (المرحلة 7)
#
# ⚠️ expected_vulns هنا «تقدير تخطيطي قبل القياس» — ليست حقيقة مرجعية وليست
#    نتيجة تجريبية. الحقيقة المرجعية الحقيقية تُملأ يدوياً في
#    evaluation/dataset/ground_truth/<app_id>.json بواسطة الخبراء (لم تُملأ بعد).
#
# الحقول:
#   id, name, source (رابط رسمي), category, expected_vulns (تقدير),
#   masvs_categories (النطاقات المتوقعة), package_name, apk_file (اسم الملف المتوقع
#   في data/apks/)، وcontext (يُزرع في app_context لتشغيل الفحص عليه).
# =====================================================================
apps:
  - id: diva
    name: "DIVA (Damn Insecure and Vulnerable App)"
    source: "https://github.com/payatu/diva-android"
    category: "utility"
    expected_vulns: 13
    masvs_categories: ["MASVS-STORAGE", "MASVS-CRYPTO", "MASVS-CODE"]
    package_name: "jakhar.aseem.diva"
    apk_file: "diva.apk"
    context: {data_sensitivity: MEDIUM, industry: utility, user_base_size: small,
              internet_facing: false, business_criticality: LOW}

  - id: insecurebankv2
    name: "InsecureBankv2"
