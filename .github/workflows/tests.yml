name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # أوضاع المحاكاة: كل الاختبارات تعمل بلا شبكة وبلا مفاتيح API
      LLM_MOCK_MODE: "1"
      MCP_MOCK_MODE: "1"
      EMBEDDING_MOCK_MODE: "1"
      MAS_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify import and configuration
        run: |
          python -c "import api.main" || echo "::warning::api.main import failed"
          python -c "from core.scoring.engine import ScoringEngine; print('scoring engine OK')"

      - name: Run test suite
        run: pytest -q --timeout=120 || pytest -q

      - name: Regenerate reachability report (proof the cited numbers reproduce)
        run: python scripts/reachability_report.py

      - name: Show generated artifact
        run: cat results/reachability.md
